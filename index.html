<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบชำระค่าบ้าน</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --ink:#10243E; --primary-dark:#10243E; --primary:#1F4FD8; --primary-light:#8FB0F5;
      --bg:#EEF1F5; --white:#fff; --line:#DCE2EA; --soft:#F6F8FB;
      --text-main:#17202E; --text-muted:#5F6B7C; --danger:#C0392B; --ok:#0F7B5F;
    }
    *{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans Thai','Sarabun',sans-serif}
    body{background:var(--bg);color:var(--text-main);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:20px 14px 40px;font-size:15px;line-height:1.55}
    .container{background:var(--white);width:100%;max-width:520px;border-radius:14px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(16,36,62,.06),0 10px 28px rgba(16,36,62,.07);overflow:hidden}
    .header{background:var(--ink);color:#fff;padding:22px 24px;display:flex;align-items:center;gap:14px}
    .brand-mark{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:21px;flex-shrink:0}
    .header h2{font-size:19px;font-weight:600}
    .header p{font-size:13px;color:#A9BAD3;margin-top:1px}
    .body{padding:24px}

    .form-group{margin-bottom:18px}
    label{display:block;font-size:14px;font-weight:500;color:var(--ink);margin-bottom:7px}
    input[type=text],input[type=number],input[type=password],select,textarea{width:100%;padding:11px 14px;border:1px solid #C5CDD9;border-radius:10px;font-size:15px;color:var(--text-main);background:#fff;transition:border-color .15s,box-shadow .15s;outline:none}
    input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,79,216,.16)}
    button:focus-visible,.tabbtn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
    textarea{resize:vertical}
    input[type=file]{width:100%;padding:10px;border:1px dashed #AEB9C8;border-radius:10px;background:var(--soft);cursor:pointer;font-size:14px}

    .radio-group{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .radio-box{border:1px solid #C5CDD9;border-radius:10px;padding:11px;text-align:center;cursor:pointer;font-weight:500;background:#fff;transition:.15s}
    .radio-group input[type=radio]{display:none}
    .radio-group input[type=radio]:checked+.radio-box{background:#EEF3FF;border-color:var(--primary);color:var(--primary);font-weight:600}
    .qr-box{display:none;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px;text-align:center}
    .qr-box img{width:100%;max-width:250px;border-radius:10px;background:#fff;border:1px solid var(--line)}
    .qr-box .acc{margin-top:10px;font-size:14px}
    .qr-box .acc small{color:var(--text-muted)}
    .slip-box{display:none;margin-top:14px}

    .btn-primary{width:100%;background:var(--primary);color:#fff;border:none;padding:13px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px;transition:background .15s}
    .btn-primary:hover{background:#1A43B8}
    .btn-primary:disabled{background:#B6C0CE;cursor:not-allowed}
    .btn-outline{width:100%;background:#fff;color:var(--primary);border:1px solid var(--primary);padding:12px;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;margin-top:10px}
    .btn-outline:hover{background:#F3F6FF}
    .btn-small{background:var(--primary);color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;margin-top:10px}
    .btn-link{background:none;border:none;color:var(--primary);cursor:pointer;font-size:14px;margin-top:14px;text-decoration:underline}
    .divider{display:flex;align-items:center;gap:12px;color:var(--text-muted);font-size:13px;margin:22px 0 4px}
    .divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
    .hidden{display:none!important}

    .hello{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    .hello strong{font-size:17px;font-weight:600;color:var(--ink)}
    .err{color:var(--danger);font-size:14px;margin-top:10px;text-align:center}
    .hint{font-size:13px;color:var(--text-muted);margin-bottom:14px;line-height:1.6}

    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:#E8ECF2;border-radius:12px;margin-bottom:20px}
    .tabbtn{border:none;background:transparent;border-radius:9px;padding:10px 4px;font-weight:500;font-size:14px;cursor:pointer;color:var(--text-muted)}
    .tabbtn.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(16,36,62,.14)}

    .status{border-radius:12px;padding:16px 18px;margin-bottom:20px;border:1px solid}
    .status.bad{background:#FDF2F0;border-color:#F3CFC9}
    .status.good{background:#EDF8F3;border-color:#C5E6D8}
    .status h3{font-size:16px;font-weight:600;margin-bottom:4px}
    .status.bad h3{color:var(--danger)} .status.good h3{color:var(--ok)}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .chip{background:#fff;border:1px solid #F0C4BD;color:var(--danger);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:500}
    .notice{background:#FFF8E6;border:1px solid #F1DDA5;border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:14px}
    .notice b{color:#7A5200}
    .history{margin-top:24px;border-top:1px solid var(--line);padding-top:16px}
    .history h4{font-size:15px;font-weight:600;margin-bottom:10px;color:var(--ink)}
    .h-row{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid #EEF1F5}

    .tag{font-size:12px;padding:3px 10px;border-radius:999px;font-weight:600;white-space:nowrap}
    .tag.pending{background:#FFF1CC;color:#7A5200}.tag.confirmed{background:#DDF3EA;color:#0B6B52}.tag.rejected{background:#FBE4E1;color:#A93226}
    .tag.prog{background:#E3ECFF;color:#1F4FD8}.tag.gray{background:#E8ECF1;color:#4A5668}

    .thumb{width:60px;height:60px;object-fit:cover;border-radius:9px;border:1px solid var(--line);display:block}
    .item{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:14px}
    .item .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:4px}
    .item small{color:var(--text-muted)}

    /* เวรห้องน้ำ */
    .floor-card{border:1px solid var(--line);border-radius:14px;margin-bottom:18px;overflow:hidden;background:#fff}
    .floor-head{padding:14px 16px;background:var(--soft);border-bottom:1px solid var(--line)}
    .floor-head h4{font-size:16px;font-weight:600;color:var(--ink)}
    .floor-head small{color:var(--text-muted);font-size:13px}
    .duty-now{display:flex;gap:14px;align-items:center;padding:18px 16px;background:var(--ink);color:#fff}
    .duty-now .avatar{width:52px;height:52px;border-radius:14px;background:#fff;color:var(--ink);font-size:24px;font-weight:600;display:grid;place-items:center;flex-shrink:0}
    .duty-now .who{flex:1;min-width:0}
    .duty-now .who small{display:block;color:#A9BAD3;font-size:13px}
    .duty-now .who b{display:block;font-size:19px;font-weight:600;line-height:1.35}
    .done-photo{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff}
    .done-photo small{color:var(--text-muted);font-size:13px}
    .upload{margin:14px 16px;padding:14px;border:1px dashed var(--primary-light);border-radius:12px;background:#F5F8FF}
    .sub{padding:14px 16px 0;font-size:13px;font-weight:600;color:var(--text-muted)}
    .timeline{list-style:none;padding:4px 16px 10px}
    .tl{position:relative;padding:11px 0 11px 24px;border-bottom:1px solid #EEF1F5}
    .tl:last-child{border-bottom:none}
    .tl:before{content:"";position:absolute;left:3px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;border:2px solid #AEB9C8;background:#fff}
    .tl b{font-weight:500;font-size:15px}
    .tl small{display:block;color:var(--text-muted);font-size:13px}
    .me-badge{font-size:11px;font-weight:600;background:#E3ECFF;color:var(--primary);border-radius:999px;padding:1px 8px;margin-left:4px}

    .modal{display:none;position:fixed;inset:0;background:rgba(16,36,62,.55);justify-content:center;align-items:center;padding:20px;z-index:1000}
    .modal-content{background:#fff;padding:28px;border-radius:14px;text-align:center;max-width:380px;width:100%;animation:pop .2s ease}
    .success-icon{width:56px;height:56px;background:#DDF3EA;color:var(--ok);border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:28px;margin:0 auto 16px}
    @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="brand-mark">🏠</div>
    <div>
      <h2>ระบบชำระค่าบ้าน</h2>
      <p>หอพักนักเรียน ม.4 - ม.6</p>
    </div>
  </div>

  <!-- หน้าแรก: กรอกชื่ออย่างเดียว (ไม่ใช้รหัส) -->
  <div class="body" id="loginView">
    <div class="form-group">
      <label for="loginName">ชื่อ - นามสกุล</label>
      <input type="text" id="loginName" placeholder="กรอกชื่อและนามสกุลให้ตรงกับที่ลงทะเบียน" autocomplete="off">
    </div>
    <button class="btn-primary" id="loginBtn" onclick="login()">เข้าสู่ระบบ</button>
    <div class="err" id="loginErr"></div>

    <div class="divider"><span>หรือ</span></div>
    <button type="button" class="btn-outline" onclick="showGuest()">🧾 ไม่ใช่ผู้เช่ารายเดือน · จ่ายเงิน</button>
  </div>

  <!-- จ่ายเงินสำหรับผู้ที่ไม่ใช่ผู้เช่ารายเดือน (ไม่ใช้รหัส) -->
  <div class="body hidden" id="guestView">
    <div class="hello">
      <strong>🧾 ชำระเงิน (ไม่ใช่ผู้เช่ารายเดือน)</strong>
      <button type="button" class="btn-link" style="margin:0" onclick="hideGuest()">← กลับ</button>
    </div>
    <form id="guestForm" onsubmit="submitGuest(event)">
      <div class="form-group">
        <label for="gName">ชื่อ - นามสกุล</label>
        <input type="text" id="gName" maxlength="120" placeholder="ชื่อผู้ชำระเงิน" required>
      </div>
      <div class="form-group">
        <label for="gPurpose">ชำระค่าอะไร</label>
        <input type="text" id="gPurpose" maxlength="150" placeholder="เช่น ค่าที่พักรายวัน, ค่าซักผ้า" required>
      </div>
      <div class="form-group">
        <label for="gReceiver">ชำระเงินที่ใคร</label>
        <select id="gReceiver" required><option value="" disabled selected>เลือกชื่อ</option></select>
      </div>
      <div class="form-group">
        <label>รูปแบบการชำระเงิน</label>
        <div class="radio-group">
          <label><input type="radio" name="gMethod" value="เงินสด" checked onclick="toggleBox('g',false)"><div class="radio-box">เงินสด</div></label>
          <label><input type="radio" name="gMethod" value="โอนเงิน" onclick="toggleBox('g',true)"><div class="radio-box">โอนเงิน</div></label>
        </div>
        <div id="gQrBox" class="qr-box">
          <div class="qr-slot"></div>
          <div class="acc"><strong style="color:var(--primary)">ธนาคารกรุงไทย</strong><br><small>ชื่อบัญชี: วัรดีนาร์ ยูโซะ</small></div>
        </div>
        <div id="gSlipBox" class="slip-box">
          <label for="gSlipFile">แนบสลิปการโอนเงิน</label>
          <input type="file" id="gSlipFile" accept="image/*">
        </div>
      </div>
      <div class="form-group">
        <label for="gAmount">จำนวนเงินที่ชำระ (บาท)</label>
        <input type="number" id="gAmount" min="1" max="100000" required>
      </div>
      <div class="form-group">
        <label for="gNote">เพิ่มเติม</label>
        <textarea id="gNote" rows="2" maxlength="500" placeholder="เพิ่มเติม (ถ้ามี)"></textarea>
      </div>
      <button type="submit" class="btn-primary" id="guestBtn">บันทึกการชำระเงิน</button>
    </form>
  </div>

  <!-- หลังเข้าสู่ระบบ -->
  <div class="body hidden" id="mainView">
    <div class="hello">
      <div><strong id="helloName"></strong><br><small id="helloGrade" style="color:var(--text-muted)"></small></div>
      <button class="btn-link" style="margin:0" onclick="logout()">ออกจากระบบ</button>
    </div>

    <div id="dutyBanner"></div>
    <div class="tabs">
      <button type="button" class="tabbtn active" data-t="clean" onclick="showTab('clean')">🚿 ห้องน้ำ</button>
      <button type="button" class="tabbtn" data-t="repair" onclick="showTab('repair')">🔧 แจ้งซ่อม</button>
      <button type="button" class="tabbtn" data-t="pay" onclick="showTab('pay')">💰 ค่าบ้าน</button>
    </div>

    <!-- เวรทำความสะอาดห้องน้ำ (ทุกคนเห็น ไม่ใช้รหัส) -->
    <div id="tab-clean">
      <p class="hint" id="cleanHint"></p>
      <div id="cleanBoard"><p class="hint">กำลังโหลด...</p></div>
    </div>

    <!-- แจ้งซ่อม (ทุกคนเห็น ไม่ใช้รหัส) -->
    <div id="tab-repair" class="hidden">
      <p class="hint">รายการแจ้งซ่อมนี้ทุกคนในหอมองเห็นได้</p>
      <form id="repairForm" onsubmit="submitRepair(event)">
        <div class="form-group">
          <label for="rTitle">เรื่องที่แจ้ง</label>
          <input type="text" id="rTitle" maxlength="150" placeholder="เช่น หลอดไฟห้องน้ำเสีย, ก๊อกน้ำรั่ว" required>
        </div>
        <div class="form-group">
          <label for="rLoc">สถานที่</label>
          <select id="rLoc">
            <option>ห้องน้ำชั้นบน</option><option>ห้องน้ำชั้นล่าง</option><option>ห้องนอน</option>
            <option>ห้องครัว / ซักล้าง</option><option>อื่น ๆ</option>
          </select>
        </div>
        <div class="form-group">
          <label for="rDetail">รายละเอียด</label>
          <textarea id="rDetail" rows="2" maxlength="1000" placeholder="อธิบายเพิ่มเติม (ถ้ามี)"></textarea>
        </div>
        <div class="form-group">
          <label for="rPhoto">แนบรูป (ถ้ามี)</label>
          <input type="file" id="rPhoto" accept="image/*">
        </div>
        <button type="submit" class="btn-primary" id="repairBtn">ส่งเรื่องแจ้งซ่อม</button>
      </form>
      <div class="history"><h4>รายการแจ้งซ่อมทั้งหมด</h4><div id="repairList"></div></div>
    </div>

    <!-- ค่าบ้าน (ต้องใส่รหัส เห็นเฉพาะตัวเอง) -->
    <div id="tab-pay" class="hidden">
      <div id="payContent">
        <div id="noticeList"></div>
        <div id="statusBox" class="status"></div>

        <form id="payForm" onsubmit="submitPayment(event)">
          <div class="form-group">
            <label for="month">ชำระค่าบ้านประจำเดือน</label>
            <select id="month" required onchange="fillAmount()"></select>
          </div>

          <div class="form-group">
            <label for="receiver">ชำระเงินที่ใคร</label>
            <select id="receiver" required><option value="" disabled selected>เลือกชื่อ</option></select>
          </div>

          <div class="form-group">
            <label>รูปแบบการชำระเงิน</label>
            <div class="radio-group">
              <label><input type="radio" name="payMethod" value="เงินสด" checked onclick="toggleBox('p',false)"><div class="radio-box">เงินสด</div></label>
              <label><input type="radio" name="payMethod" value="โอนเงิน" onclick="toggleBox('p',true)"><div class="radio-box">โอนเงิน</div></label>
            </div>

            <div id="pQrBox" class="qr-box">
              <div class="qr-slot"></div>
              <div class="acc">
                <strong style="color:var(--primary)">ธนาคารกรุงไทย</strong><br>
                <small>ชื่อบัญชี: วัรดีนาร์ ยูโซะ</small>
              </div>
            </div>

            <div id="pSlipBox" class="slip-box">
              <label for="pSlipFile">แนบสลิปการโอนเงิน</label>
              <input type="file" id="pSlipFile" accept="image/*">
            </div>
          </div>

          <div class="form-group">
            <label for="amount">จำนวนเงินที่ชำระ (บาท)</label>
            <input type="number" id="amount" min="1" required>
          </div>

          <div class="form-group">
            <label for="note">เพิ่มเติม</label>
            <textarea id="note" rows="2" placeholder="เพิ่มเติม (ถ้ามี) เช่น ค้างคืน"></textarea>
          </div>

          <button type="submit" class="btn-primary" id="submitBtn">บันทึกการชำระเงิน</button>
        </form>

      </div>
    </div>
  </div>
</div>

<div id="successModal" class="modal">
  <div class="modal-content">
    <div class="success-icon">✓</div>
    <h3 style="color:var(--primary-dark);margin-bottom:10px">บันทึกข้อมูลสำเร็จ!</h3>
    <p id="successMsg" style="font-size:14px;color:var(--text-muted);margin-bottom:20px"></p>
    <button class="btn-primary" style="margin:0" onclick="closeModal()">ตกลง</button>
  </div>
</div>

<script>
  // ====== ตั้งค่า Supabase (Project Settings > API) ======
  const SUPABASE_URL = 'https://dlnweagzhrwcbsnahuqk.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsbndlYWd6aHJ3Y2JzbmFodXFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwMDQ1NDQsImV4cCI6MjExMDU4MDU0NH0.SLxKmlQlMhsnMgK5JCQswfdUp8NcjD4PyTXNjtjgJSw';
  // =======================================================
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let creds = null;   // { name } เข้าด้วยชื่ออย่างเดียว
  let me = null;      // ข้อมูลค่าบ้านของตัวเอง (หลังใส่รหัส)
  let board = null;   // ข้อมูลห้องน้ำ + แจ้งซ่อม
  let qrUrl = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const thMonth = k => new Date(k + '-01T00:00:00+07:00').toLocaleDateString('th-TH', {month:'long', year:'numeric'});
  const thShort = d => new Date(d + 'T00:00:00+07:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
  const thDT = d => new Date(d).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short', timeZone: 'Asia/Bangkok' });
  const curKey = () => new Date().toLocaleString('sv-SE', {timeZone:'Asia/Bangkok'}).slice(0, 7);
  const FL = { 'บน': 'ชั้นบน', 'ล่าง': 'ชั้นล่าง' };
  const photoUrl = p => sb.storage.from('dorm-photos').getPublicUrl(p).data.publicUrl;
  const thumb = p => p ? `<a href="${esc(photoUrl(p))}" target="_blank" rel="noopener"><img class="thumb" src="${esc(photoUrl(p))}" loading="lazy" alt="รูป"></a>` : '';

  function monthsRange(a, b) {
    const out = []; let [y, m] = a.split('-').map(Number); const [ey, em] = b.split('-').map(Number);
    while (y < ey || (y === ey && m <= em)) { out.push(`${y}-${String(m).padStart(2,'0')}`); m++; if (m > 12) { m = 1; y++; } }
    return out;
  }
  // ยอดรายเดือน: ใช้ยอดที่แอดมินกำหนด ถ้าไม่มีใช้ค่าบ้านปกติ (เฉพาะเดือนตั้งแต่เริ่มนับถึงเดือนนี้)
  function ledger(me) {
    const f = me.fee, start = me.start_month, cur = curKey();
    const paid = {};
    me.payments.filter(p => p.status !== 'rejected').forEach(p => paid[p.month_key] = (paid[p.month_key] || 0) + p.amount);
    const ch = {};
    (me.charges || []).forEach(c => ch[c.month_key] = c);
    const set = new Set(monthsRange(start, cur));
    Object.keys(ch).forEach(m => set.add(m)); Object.keys(paid).forEach(m => set.add(m));
    return [...set].sort().map(m => {
      const due = ch[m] ? ch[m].amount : (m >= start && m <= cur ? f : 0);
      return { month: m, due, paid: paid[m] || 0, remaining: due - (paid[m] || 0), custom: !!ch[m], note: ch[m] ? (ch[m].note || '') : '' };
    });
  }
  function calcOwed(me) {
    return ledger(me).filter(r => r.month <= curKey() && r.remaining > 0)
      .map(r => ({ month: r.month, due: r.due, remaining: r.remaining }));
  }

  // ---------- รูปภาพ ----------
  function compressImage(file, max) {
    return new Promise((resolve, reject) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const r = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? resolve(b) : reject(new Error('แปลงรูปไม่สำเร็จ')), 'image/jpeg', 0.85);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('เปิดไฟล์รูปไม่ได้ (ลองถ่ายใหม่หรือเลือกไฟล์ JPG/PNG)')); };
      img.src = url;
    });
  }
  async function uploadImg(bucket, file, folder, max = 1280) {
    let blob = file, type = file.type || 'image/jpeg';
    let ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
    try { blob = await compressImage(file, max); type = 'image/jpeg'; ext = 'jpg'; }
    catch (e) { if (file.size > 5 * 1024 * 1024) throw e; }
    const path = `${folder}/${new Date().toISOString().slice(0, 7)}/${crypto.randomUUID()}.${ext}`;
    const { error } = await sb.storage.from(bucket).upload(path, blob, { contentType: type });
    if (error) throw new Error('อัปโหลดรูปไม่สำเร็จ: ' + error.message);
    return path;
  }

  // ---------- QR + ผู้รับเงิน ----------
  async function loadConfig() {
    try {
      const { data } = await sb.rpc('get_public_config');
      if (data && data.qr_path) qrUrl = sb.storage.from('qr').getPublicUrl(data.qr_path).data.publicUrl;
    } catch (e) {}
    document.querySelectorAll('.qr-slot').forEach(el => {
      el.innerHTML = qrUrl
        ? `<img src="${esc(qrUrl)}" alt="QR รับเงิน"><br><button type="button" class="btn-small" onclick="saveQr()">บันทึกรูป QR</button>`
        : '<p style="color:#b91c1c;font-size:14px">ผู้ดูแลยังไม่ได้อัปโหลด QR กรุณาติดต่อผู้ดูแล</p>';
    });
  }
  async function saveQr() {
    try {
      const b = await (await fetch(qrUrl)).blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = 'qr-payment.png'; a.click();
    } catch (e) { window.open(qrUrl, '_blank'); }
  }
  async function loadReceivers() {
    const { data } = await sb.from('receivers').select('name').eq('active', true).order('id');
    const html = '<option value="" disabled selected>เลือกชื่อ</option>' +
      (data || []).map(r => `<option value="${esc(r.name)}">${esc(r.name)}</option>`).join('');
    $('receiver').innerHTML = html; $('gReceiver').innerHTML = html;
  }
  function toggleBox(p, show) {
    $(p + 'QrBox').style.display = show ? 'block' : 'none';
    $(p + 'SlipBox').style.display = show ? 'block' : 'none';
    $(p + 'SlipFile').required = show;
  }

  function showSuccess(msg) { $('successMsg').textContent = msg; $('successModal').style.display = 'flex'; }
  function closeModal() { $('successModal').style.display = 'none'; }

  // ---------- เข้าสู่ระบบด้วยชื่อ (ไม่ใช้รหัส) ----------
  async function login() {
    const name = $('loginName').value.trim();
    $('loginErr').textContent = '';
    if (!name) { $('loginErr').textContent = 'กรุณากรอกชื่อ'; return; }
    $('loginBtn').disabled = true; $('loginBtn').textContent = 'กำลังตรวจสอบ...';
    const { data, error } = await sb.rpc('board_by_name', { p_name: name });
    $('loginBtn').disabled = false; $('loginBtn').textContent = 'เข้าสู่ระบบ';
    if (error) { $('loginErr').textContent = 'เชื่อมต่อระบบไม่ได้: ' + error.message; return; }
    if (!data) { $('loginErr').textContent = 'ไม่พบชื่อนี้ในระบบ (ตรวจตัวสะกดให้ตรงกับที่ลงทะเบียน)'; return; }
    creds = { name };
    sessionStorage.setItem('name', name);
    board = data;
    enterMain();
  }

  function enterMain() {
    $('loginView').classList.add('hidden'); $('guestView').classList.add('hidden'); $('mainView').classList.remove('hidden');
    $('helloName').textContent = board.me.name; $('helloGrade').textContent = board.me.grade || '';
    renderBoard(); showTab('clean', true); loadMe();
  }

  function logout() {
    sessionStorage.removeItem('name'); creds = me = board = null;
    $('mainView').classList.add('hidden'); $('loginView').classList.remove('hidden');
    $('loginName').value = '';
  }

  function showTab(t, skipLoad) {
    document.querySelectorAll('.tabbtn').forEach(b => b.classList.toggle('active', b.dataset.t === t));
    ['clean', 'repair', 'pay'].forEach(x => $('tab-' + x).classList.toggle('hidden', x !== t));
    if (!skipLoad && (t === 'clean' || t === 'repair')) loadBoard();
  }

  // ---------- จ่ายเงินแบบไม่ต้องใช้รหัส (ไม่ใช่ผู้เช่ารายเดือน) ----------
  function showGuest() { $('loginView').classList.add('hidden'); $('guestView').classList.remove('hidden'); }
  function hideGuest() { $('guestView').classList.add('hidden'); $('loginView').classList.remove('hidden'); }

  async function submitGuest(e) {
    e.preventDefault();
    const btn = $('guestBtn'); btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
    try {
      const method = document.querySelector('input[name=gMethod]:checked').value;
      let slip = '';
      if (method === 'โอนเงิน') {
        const f = $('gSlipFile').files[0];
        if (!f) throw new Error('กรุณาแนบสลิป');
        slip = await uploadImg('slips', f, 'guest', 1600);
      }
      const { data, error } = await sb.rpc('submit_guest_payment', {
        p_name: $('gName').value.trim(), p_purpose: $('gPurpose').value.trim(),
        p_amount: parseInt($('gAmount').value, 10), p_method: method,
        p_receiver: $('gReceiver').value, p_slip_path: slip, p_note: $('gNote').value.trim()
      });
      if (error) throw new Error(error.message);
      if (!data.ok) throw new Error(data.message);
      $('guestForm').reset(); toggleBox('g', false);
      showSuccess('บันทึกการชำระเงินเรียบร้อย ขอบคุณครับ/ค่ะ');
    } catch (err) {
      alert('เกิดข้อผิดพลาด: ' + err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'บันทึกการชำระเงิน';
    }
  }

  // ---------- ค่าบ้าน (ต้องใส่รหัส) ----------
  async function loadMe() {
    const { data } = await sb.rpc('get_student_status_by_name', { p_name: creds.name });
    if (data) { me = data; renderPay(true); }
  }

  async function refresh() {
    const { data } = await sb.rpc('get_student_status_by_name', { p_name: creds.name });
    if (data) { me = data; renderPay(false); }
  }

  function renderPay(markRead) {
    // แจ้งเตือนจากแอดมิน
    $('noticeList').innerHTML = me.notices.map(n =>
      `<div class="notice"><b>📢 แจ้งเตือนจากผู้ดูแล</b><br>${esc(n.message)}</div>`).join('');
    if (markRead && me.notices.length) sb.rpc('mark_notices_read_by_name', { p_name: creds.name });

    // ยอดค้าง
    const owed = calcOwed(me), box = $('statusBox');
    if (owed.length) {
      box.className = 'status bad';
      box.innerHTML = `<h3>ค้างชำระ ${owed.length} เดือน</h3>
        <div class="chips">${owed.map(o => `<span class="chip">${thMonth(o.month)}</span>`).join('')}</div>`;
    } else {
      box.className = 'status good';
      box.innerHTML = '<h3>✓ ชำระครบทุกเดือนแล้ว</h3><span style="font-size:14px">ขอบคุณครับ/ค่ะ</span>';
    }

    // dropdown เดือน: เดือนที่ค้าง + เดือนปัจจุบัน
    const opts = owed.map(o => o.month);
    if (!opts.includes(curKey())) opts.push(curKey());
    $('month').innerHTML = opts.map(m => `<option value="${m}">${thMonth(m)}</option>`).join('');
    fillAmount();

  }

  function fillAmount() {
    $('amount').value = me.fee;
  }

  async function submitPayment(e) {
    e.preventDefault();
    const btn = $('submitBtn'); btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
    try {
      const method = document.querySelector('input[name=payMethod]:checked').value;
      let slipPath = '';
      if (method === 'โอนเงิน') {
        const f = $('pSlipFile').files[0];
        if (!f) throw new Error('กรุณาแนบสลิป');
        slipPath = await uploadImg('slips', f, 'slips', 1600);
      }
      const { data, error } = await sb.rpc('submit_payment_by_name', {
        p_name: creds.name, p_month: $('month').value,
        p_amount: parseInt($('amount').value, 10), p_method: method,
        p_receiver: $('receiver').value, p_slip_path: slipPath, p_note: $('note').value.trim()
      });
      if (error) throw new Error(error.message);
      if (!data.ok) throw new Error(data.message);

      await refresh();
      const owed = calcOwed(me);
      showSuccess(owed.length
        ? `ยังค้างอีก ${owed.length} เดือน: ${owed.map(o => thMonth(o.month)).join(', ')}`
        : 'ชำระครบทุกเดือนแล้ว 🎉');
      $('payForm').reset(); toggleBox('p', false); fillAmount();
    } catch (err) {
      alert('เกิดข้อผิดพลาด: ' + err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'บันทึกการชำระเงิน';
    }
  }

  // ---------- แจ้งซ่อม + ห้องน้ำ (ไม่ใช้รหัส) ----------
  async function loadBoard() {
    if (!creds) return;
    const { data, error } = await sb.rpc('board_by_name', { p_name: creds.name });
    if (error || !data) {
      const m = '<p class="err">โหลดข้อมูลไม่สำเร็จ' + (error ? ': ' + esc(error.message) : '') + '</p>';
      $('cleanBoard').innerHTML = m; $('repairList').innerHTML = m; return;
    }
    board = data; renderBoard();
  }

  function renderBoard() {
    const meB = board.me;

    // แบนเนอร์เตือนเวร
    let banner = '';
    if (meB.floor) {
      const cur = board.floors[meB.floor].schedule.find(x => x.is_current);
      if (cur && cur.student_id === meB.id && !cur.done)
        banner = `<div class="notice" style="background:#eff6ff;border-color:#bfdbfe"><b>🚿 ถึงเวรคุณทำความสะอาดห้องน้ำ${FL[meB.floor]}</b><br>รอบวันที่ ${thShort(cur.period_start)} – ${thShort(cur.period_end)} · ถ่ายรูปส่งหลังทำเสร็จ<br><button type="button" class="btn-small" onclick="showTab('clean')">ไปส่งรูป</button></div>`;
    }
    $('dutyBanner').innerHTML = banner;
    const startTxt = board.started ? '' : ' เวรเริ่มวันที่ ' + new Date(board.anchor + 'T00:00:00+07:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' });
    $('cleanHint').textContent = `เวรหมุนเวียนทุก 2 สัปดาห์ ถ่ายรูปส่งภายในรอบของตัวเอง หากไม่ส่งปรับรอบละ ${board.fine ?? 20} บาท${startTxt}`;

    // รายการแจ้งซ่อม
    const st = { new: ['pending', 'รอรับเรื่อง'], in_progress: ['prog', 'กำลังซ่อม'], done: ['confirmed', 'ซ่อมแล้ว'] };
    $('repairList').innerHTML = board.repairs.length ? board.repairs.map(r => `
      <div class="item">
        <div class="top"><b>${esc(r.title)}</b><span class="tag ${st[r.status][0]}">${st[r.status][1]}</span></div>
        <small>${esc(r.location || '')} · แจ้งโดย ${esc(r.reporter)} · ${thDT(r.created_at)}</small>
        ${r.detail ? `<p style="margin-top:6px">${esc(r.detail)}</p>` : ''}
        ${r.admin_note ? `<p style="margin-top:6px;color:#b45309"><b>ผู้ดูแล:</b> ${esc(r.admin_note)}</p>` : ''}
        ${r.photo_path ? `<div style="margin-top:8px">${thumb(r.photo_path)}</div>` : ''}
      </div>`).join('') : '<p class="hint">ยังไม่มีรายการแจ้งซ่อม</p>';

    // ห้องน้ำ
    $('cleanBoard').innerHTML = ['บน', 'ล่าง'].map(renderFloor).join('');
  }

  function renderFloor(fl) {
    const f = board.floors[fl], n = f.members.length, meId = board.me.id;
    const head = `<div class="floor-head"><h4>ห้องน้ำ${FL[fl]}</h4><small>สมาชิก ${n} คน หมุนเวียนครบรอบทุก ${n * 2} สัปดาห์</small></div>`;
    if (!n) return `<div class="floor-card">${head}<p class="hint" style="padding:16px;margin:0">ยังไม่มีสมาชิกในเวรชั้นนี้</p></div>`;

    const initial = nm => (String(nm || '').match(/[ก-ฮA-Za-z]/) || ['?'])[0];
    const cur = f.schedule.find(x => x.is_current);
    const rest = f.schedule.filter(x => !x.is_current);
    const mine = cur && cur.student_id === meId;

    let now = '';
    if (cur) {
      const st = cur.done ? '<span class="tag confirmed">ส่งรูปแล้ว</span>' : '<span class="tag pending">รอส่งรูป</span>';
      now = `<div class="duty-now">
          <div class="avatar">${esc(initial(cur.name))}</div>
          <div class="who"><small>เวรรอบนี้ ${thShort(cur.period_start)} – ${thShort(cur.period_end)}</small>
            <b>${esc(cur.name || '-')}${cur.student_id === meId ? ' (คุณ)' : ''}</b></div>${st}</div>`
        + (cur.photo_path ? `<div class="done-photo">${thumb(cur.photo_path)}<small>ส่งเมื่อ ${thDT(cur.done_at)}</small></div>` : '');
    }

    const upload = mine ? `
      <div class="upload">
        <label for="cleanFile">${cur.done ? 'ส่งรูปรอบนี้แล้ว ส่งใหม่เพื่อแทนที่ได้' : 'ถึงเวรคุณแล้ว ถ่ายรูปห้องน้ำหลังทำความสะอาด'}</label>
        <input type="file" id="cleanFile" accept="image/*" capture="environment">
        <button type="button" class="btn-primary" id="cleanBtn" onclick="submitCleaning()">ส่งรูปยืนยัน</button>
      </div>` : '';

    const rows = rest.map(it => `<li class="tl"><b>${esc(it.name || '-')}</b>${it.student_id === meId ? '<span class="me-badge">คุณ</span>' : ''}
        <small>${thShort(it.period_start)} – ${thShort(it.period_end)}</small></li>`).join('');

    return `<div class="floor-card">${head}${now}${upload}${rows ? `<div class="sub">${board.started ? 'รอบถัดไป' : 'ลำดับเวร'}</div><ul class="timeline">${rows}</ul>` : ''}</div>`;
  }

  async function submitCleaning() {
    const f = $('cleanFile').files[0];
    if (!f) return alert('กรุณาถ่ายหรือเลือกรูปก่อน');
    const btn = $('cleanBtn'); btn.disabled = true; btn.textContent = 'กำลังอัปโหลด...';
    try {
      const path = await uploadImg('dorm-photos', f, 'clean');
      const { data, error } = await sb.rpc('submit_cleaning_by_name', { p_name: creds.name, p_photo_path: path });
      if (error) throw new Error(error.message);
      if (!data.ok) throw new Error(data.message);
      await loadBoard();
      alert('ส่งรูปเรียบร้อย ขอบคุณที่ทำความสะอาด 🙏');
    } catch (err) {
      alert('เกิดข้อผิดพลาด: ' + err.message);
      btn.disabled = false; btn.textContent = 'ส่งรูปยืนยัน';
    }
  }

  async function submitRepair(e) {
    e.preventDefault();
    const btn = $('repairBtn'); btn.disabled = true; btn.textContent = 'กำลังส่ง...';
    try {
      const f = $('rPhoto').files[0];
      const path = f ? await uploadImg('dorm-photos', f, 'repair') : '';
      const { data, error } = await sb.rpc('submit_repair_by_name', {
        p_name: creds.name, p_title: $('rTitle').value,
        p_location: $('rLoc').value, p_detail: $('rDetail').value.trim(), p_photo_path: path
      });
      if (error) throw new Error(error.message);
      if (!data.ok) throw new Error(data.message);
      $('repairForm').reset();
      await loadBoard();
      alert('ส่งเรื่องแจ้งซ่อมแล้ว');
    } catch (err) {
      alert('เกิดข้อผิดพลาด: ' + err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'ส่งเรื่องแจ้งซ่อม';
    }
  }

  // ---------- เริ่มต้น ----------
  loadConfig(); loadReceivers();
  (async () => {
    const saved = sessionStorage.getItem('name');
    if (!saved) return;
    const { data } = await sb.rpc('board_by_name', { p_name: saved });
    if (data) { creds = { name: saved }; board = data; enterMain(); }
  })();
  $('loginName').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
